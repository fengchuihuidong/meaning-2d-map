<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f0ea" />
<title>人生意义二维坐标：哲学家与流派</title>
<style>
  :root {
    --bg: #f3f0ea;
    --ink: #1a1c1e;
    --muted: #5c6370;
    --line: #2b2f36;
    --panel: #fffcf7;
    --border: #ddd6cb;
    --q1: #dfe9fb;
    --q2: #f8e3e0;
    --q3: #dff0e5;
    --q4: #f8efd4;
    --shadow: 0 12px 40px rgba(26,28,30,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,252,247,.92);
    backdrop-filter: blur(8px);
    z-index: 5;
  }
  .topbar h1 {
    margin: 0;
    font-size: clamp(1.05rem, 2vw, 1.35rem);
    font-weight: 700;
  }
  .topbar .hint {
    color: var(--muted);
    font-size: .88rem;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .controls button, .filters button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: .88rem;
    cursor: pointer;
    color: var(--ink);
  }
  .controls button:hover, .filters button:hover,
  .filters button.active {
    border-color: var(--ink);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: .86rem;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot-swatch {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr minmax(240px, 300px);
    min-height: 0;
  }
  @media (max-width: 860px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .side {
      max-height: min(38vh, 320px);
      border-left: none;
      border-top: 1px solid var(--border);
    }
  }
  .viewport {
    position: relative;
    overflow: hidden;
    background: #ebe6dc;
    cursor: grab;
    touch-action: none;
  }
  .viewport.dragging { cursor: grabbing; }
  .canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1100px;
    height: 1100px;
    transform-origin: 0 0;
    will-change: transform;
  }
  .plot {
    position: absolute;
    inset: 72px 80px 80px 80px;
    border: 1px solid rgba(43,47,54,.12);
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .quad { position: absolute; width: 50%; height: 50%; }
  .q-tl { left:0; top:0; background: var(--q1); }
  .q-tr { right:0; top:0; background: var(--q2); }
  .q-bl { left:0; bottom:0; background: var(--q3); }
  .q-br { right:0; bottom:0; background: var(--q4); }
  .axis-h, .axis-v {
    position: absolute; background: var(--line); z-index: 2;
  }
  .axis-h { left:0; right:0; top:50%; height:2px; transform: translateY(-50%); }
  .axis-v { top:0; bottom:0; left:50%; width:2px; transform: translateX(-50%); }
  .axis-arrow {
    position: absolute; z-index: 3; color: var(--line); font-size: 18px;
    line-height: 1; pointer-events: none;
  }
  .axis-label {
    position: absolute; z-index: 4; font-weight: 700;
    font-size: 1.2rem; padding: 6px 12px; border-radius: 10px;
    background: rgba(255,252,247,.97); border: 1px solid var(--border);
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .al-left { left: 8px; top: 50%; transform: translateY(-130%); }
  .al-right { right: 8px; top: 50%; transform: translateY(-130%); }
  .al-top { top: 10px; left: 50%; transform: translateX(12px); }
  .al-bottom { bottom: 12px; left: 50%; transform: translateX(12px); }
  .axis-sub {
    display: block; font-weight: 500; font-size: .72rem; color: var(--muted); margin-top: 2px;
  }
  /* Fixed to viewport — not scaled with canvas, always readable */
  .q-overlay {
    position: absolute; z-index: 7; max-width: min(280px, 38%);
    font-size: 14px; color: #2f3540; line-height: 1.4;
    background: rgba(255,252,247,.95); padding: 10px 12px; border-radius: 12px;
    border: 1px solid rgba(221,214,203,.95);
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .q-overlay strong {
    display: block; font-size: 16px; margin-bottom: 4px; color: var(--ink);
  }
  .q-overlay.qc-tl { left: 12px; top: 12px; }
  .q-overlay.qc-tr { right: 12px; top: 12px; text-align: right; }
  .q-overlay.qc-bl { left: 12px; bottom: 52px; }
  .q-overlay.qc-br { right: 12px; bottom: 52px; text-align: right; }
  @media (max-width: 900px) {
    .topbar {
      padding: 10px 12px;
      gap: 8px;
    }
    .topbar h1 { font-size: 1.05rem; }
    .topbar .hint { font-size: .78rem; }
    .legend { display: none; }
    .controls { gap: 6px; }
    .controls button { padding: 8px 12px; min-height: 36px; }

    .q-overlay {
      max-width: min(46%, 160px);
      font-size: 11px;
      padding: 6px 8px;
      line-height: 1.3;
    }
    .q-overlay strong { font-size: 12px; margin-bottom: 2px; }
    /* On narrow screens show title only to save space */
    .q-overlay { white-space: normal; }
    .q-overlay.qc-tl, .q-overlay.qc-tr { top: 8px; }
    .q-overlay.qc-bl, .q-overlay.qc-br { bottom: 44px; }

    .axis-label {
      font-size: .85rem;
      padding: 4px 7px;
    }
    .axis-sub { display: none; }

    .point { padding: 12px; margin: -12px; }
    .point .mark { width: 22px; height: 22px; }
    /* Mobile: labels only when selected/hovered (touch = selected) */
    .point .label {
      display: none;
      max-width: none;
      font-size: .95rem;
    }
    .point.selected .label, .point:hover .label {
      display: block;
    }

    .hud {
      font-size: .72rem;
      padding: 6px 8px;
      left: 8px; bottom: 8px;
    }

    .filters { padding: 8px; gap: 4px; overflow-x: auto; flex-wrap: nowrap; }
    .filters button { flex: 0 0 auto; padding: 8px 10px; font-size: .78rem; min-height: 34px; }
    .side-empty, .side-body { padding: 10px 12px 14px; }
  }

  @media (max-width: 520px) {
    .q-overlay {
      max-width: 42%;
      font-size: 10px;
      padding: 5px 7px;
    }
    .q-overlay strong { font-size: 11px; }
    /* Drop body text under strong on very small screens via CSS trick */
    .q-overlay { font-size: 0; }
    .q-overlay strong { font-size: 11px; }
  }

  /* Safe area for notched phones */
  @supports (padding: max(0px)) {
    .topbar { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .side { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
  }

  .point {
    position: absolute; z-index: 5;
    transform: translate(-50%, -50%);
    cursor: pointer;
    /* larger hit target */
    padding: 10px;
    margin: -10px;
  }
  .point .mark {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.22);
    transition: transform .12s ease;
  }
  .point .label {
    position: absolute; white-space: nowrap;
    font-size: .95rem; font-weight: 700;
    padding: 3px 8px; border-radius: 8px;
    background: rgba(255,252,247,.96);
    border: 1px solid var(--border);
    pointer-events: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    max-width: 7.2em;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: .92;
  }
  .point:hover .mark, .point.selected .mark { transform: scale(1.28); }
  .point:hover .label, .point.selected .label {
    max-width: none;
    overflow: visible;
    opacity: 1;
    z-index: 8;
    font-size: 1.08rem;
    padding: 4px 10px;
    border-color: var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    background: #fff;
  }
  .point.selected { z-index: 12; }
  .point:hover { z-index: 11; }
  .dir-n .label { left:50%; bottom:20px; transform:translateX(-50%); }
  .dir-s .label { left:50%; top:20px; transform:translateX(-50%); }
  .dir-e .label { left:20px; top:50%; transform:translateY(-50%); }
  .dir-w .label { right:20px; top:50%; transform:translateY(-50%); }
  .dir-ne .label { left:16px; bottom:16px; }
  .dir-nw .label { right:16px; bottom:16px; }
  .dir-se .label { left:16px; top:16px; }
  .dir-sw .label { right:16px; top:16px; }

  .hud {
    position: absolute; left: 12px; bottom: 12px; z-index: 6;
    display: flex; gap: 8px; align-items: center;
    background: rgba(255,252,247,.92); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 10px; font-size: .82rem; color: var(--muted);
  }
  .hud kbd {
    font: inherit; border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 6px; background: #fff; color: var(--ink);
  }

  .side {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
    box-shadow: var(--shadow);
  }
  .side-empty, .side-body { padding: 10px 12px 12px; overflow: auto; }
  .side-empty {
    color: var(--muted); font-size: .86rem; line-height: 1.4;
  }
  .side-empty h2 {
    margin: 0 0 4px; font-size: 1rem; color: var(--ink);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .78rem; color: var(--muted); margin-bottom: 6px;
  }
  .side-body h2 {
    margin: 0 0 2px; font-size: 1.12rem; line-height: 1.25;
  }
  .coords {
    font-size: .78rem; color: var(--muted); margin-bottom: 6px;
  }
  .blurb {
    font-size: .88rem; line-height: 1.45; margin: 0 0 8px;
  }
  .meta-grid {
    display: grid; gap: 8px;
    grid-template-columns: 1fr 1fr;
    margin-top: 0;
  }
  .meta-card {
    background: #f7f3ec; border-radius: 10px; padding: 8px 10px;
  }
  .meta-card .k { font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
  .meta-card .v { font-size: .88rem; font-weight: 650; }
  .filters {
    padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 5px;
    border-bottom: 1px solid var(--border);
  }
  .filters button { padding: 4px 9px; font-size: .8rem; }

  .range-band {
    position: absolute; z-index: 1;
    background: rgba(60, 64, 72, 0.10);
    border: 1.5px dashed rgba(60, 64, 72, 0.35);
    border-radius: 10px;
    pointer-events: none;
  }
  .uncert {
    display: inline-block;
    font-size: .72rem;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    margin-left: 6px;
    vertical-align: middle;
  }
  .uncert-低 { background: #e6f4ea; color: #137333; }
  .uncert-中 { background: #fef7e0; color: #8a6d00; }
  .uncert-高 { background: #fce8e6; color: #c5221f; }
  .evidence {
    font-size: .84rem;
    line-height: 1.45;
    color: #3d4450;
    background: #f3efe7;
    border-radius: 10px;
    padding: 8px 10px;
    margin: 0 0 8px;
  }
  .range-note {
    font-size: .78rem;
    color: var(--muted);
    margin: 0 0 8px;
  }


  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    background: #fff;
  }
  .view-toggle button {
    border: none !important;
    border-radius: 0 !important;
    background: transparent;
    padding: 6px 14px;
    font: inherit;
    font-size: .88rem;
    cursor: pointer;
    color: var(--muted);
  }
  .view-toggle button.active {
    background: var(--ink);
    color: #fff;
  }
  .list-view {
    display: none;
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .workspace.mode-list .viewport { display: none; }
  .workspace.mode-list .list-view { display: block; }
  .workspace.mode-map .list-view { display: none; }
  .list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .88rem;
  }
  .list-table th, .list-table td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .list-table th {
    position: sticky; top: 0;
    background: #f7f3ec;
    font-weight: 700;
    font-size: .78rem;
    color: var(--muted);
    z-index: 1;
  }
  .list-table tr { cursor: pointer; }
  .list-table tr:hover, .list-table tr.active { background: #f3efe7; }
  .list-table tr.active { box-shadow: inset 3px 0 0 var(--ink); }
  .list-name { font-weight: 700; white-space: nowrap; }
  .list-evidence { color: #3d4450; line-height: 1.4; }
  .list-coords { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  @media (max-width: 860px) {
    .workspace.mode-list .list-view { border-right: none; }
    .list-table thead { display: none; }
    .list-table, .list-table tbody, .list-table tr, .list-table td {
      display: block; width: 100%;
    }
    .list-table tr {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .list-table td { border: none; padding: 2px 0; }
    .list-table td::before {
      content: attr(data-label);
      display: inline-block;
      min-width: 4.5em;
      color: var(--muted);
      font-size: .75rem;
      margin-right: 6px;
    }
    .list-table td.list-name-cell::before { display: none; }
    .list-name { font-size: 1rem; }
  }

</style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>人生意义二维坐标</h1>
      <div class="hint">意义来源 × 人生重心　·　点选看详情　·　拖拽平移　·　滚轮缩放</div>
    </div>
    <div class="controls">
      <div class="view-toggle" role="group" aria-label="视图切换">
        <button type="button" id="btnMap" class="active">地图</button>
        <button type="button" id="btnList">列表</button>
      </div>
      <div class="legend" id="legend"></div>
      <button type="button" id="btnReset" title="重置视图">重置视图</button>
      <button type="button" id="btnZoomIn">＋</button>
      <button type="button" id="btnZoomOut">－</button>
    </div>
  </header>

  <div class="workspace mode-map" id="workspace">
    <div class="viewport" id="viewport" aria-label="可缩放拖拽的坐标画布">
      <div class="canvas" id="canvas">
        <div class="axis-label al-left">外在给定<span class="axis-sub">意义来源 ←</span></div>
        <div class="axis-label al-right">自己生成<span class="axis-sub">→ 意义来源</span></div>
        <div class="axis-label al-top">超越自我<span class="axis-sub">人生重心 ↑</span></div>
        <div class="axis-label al-bottom">体验生命<span class="axis-sub">人生重心 ↓</span></div>
        <div class="plot" id="plot">
          <div class="quad q-tl"></div>
          <div class="quad q-tr"></div>
          <div class="quad q-bl"></div>
          <div class="quad q-br"></div>
          <div class="axis-h"></div>
          <div class="axis-v"></div>
        </div>
      </div>
      <div class="q-overlay qc-tl"><strong>客观意义倾向 ＋ 超越</strong>价值落在外在秩序／使命，朝向完善、责任或神圣目标</div>
      <div class="q-overlay qc-tr"><strong>无预设意义 ＋ 自我超越</strong>未必有给定答案，靠选择、创造与投入自我定义</div>
      <div class="q-overlay qc-bl"><strong>客观意义倾向 ＋ 体验</strong>依凭秩序／自然，重心在生命感受与临在</div>
      <div class="q-overlay qc-br"><strong>无预设意义 ＋ 体验</strong>不靠终极目的，价值安放在活着与当下姿态</div>
      <div class="hud"><kbd>拖拽</kbd>平移　<kbd>双指</kbd>缩放　<kbd>点选</kbd>详情</div>
    </div>

    <div class="list-view" id="listView" aria-label="思想家列表">
      <table class="list-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>组别</th>
            <th>坐标</th>
            <th>不确定度</th>
            <th>证据</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <aside class="side" id="side">
      <div class="filters" id="filters"></div>
      <div class="side-empty" id="sideEmpty">
        <h2>点选一位思想家</h2>
        点圆点看说明。标签缩略，悬停展开。<br>
        问的是价值安放何处。*＝位置有争议。
      </div>
      <div class="side-body" id="sideBody" hidden></div>
    </aside>
  </div>

<script>
const GROUPS = [
  { id: "宗教/传统", color: "#7b1fa2" },
  { id: "古典", color: "#1565c0" },
  { id: "现代", color: "#c62828" },
  { id: "东方", color: "#2e7d32" },
];

const POINTS = [
  { name: "基督教哲学", x: -0.68, y: 0.55, group: "宗教/传统", dir: "se",
    source: "外在给定", focus: "超越自我", uncertainty: "低",
    evidence: "救赎史与神命目的论：人生嵌入高于个人的神圣秩序。",
    blurb: "极强超越：人生指向上帝，个人生命嵌入高于个人的终极秩序。" },
  { name: "伊斯兰教哲学", x: -0.78, y: 0.70, group: "宗教/传统", dir: "w",
    source: "外在给定", focus: "超越自我", uncertainty: "低",
    evidence: "启示与沙里亚规定正当生活；意义外给色彩强。",
    blurb: "意义外在给定于神圣启示与律法秩序，人生重心偏责任与朝向超越。" },
  { name: "托马斯·阿奎那", x: -0.80, y: 0.62, group: "宗教/传统", dir: "w",
    source: "外在给定", focus: "超越自我", uncertainty: "低",
    evidence: "终极幸福是神视（visio Dei），而非单纯现世德性。",
    blurb: "综合信仰与理性：幸福与完善指向上帝，属外在目的＋超越。" },
  { name: "儒家", x: -0.42, y: 0.58, group: "宗教/传统", dir: "ne",
    source: "外在给定（天／礼）", focus: "超越自我", uncertainty: "中",
    evidence: "修身齐家治国与天命／礼乐：意义主要在人伦秩序中实现。",
    blurb: "意义主要来自关系、责任、修身与社会秩序，不只属于个人。" },
  { name: "柏拉图", x: -0.60, y: 0.68, group: "古典", dir: "ne",
    source: "外在给定（理念）", focus: "超越自我", uncertainty: "低",
    evidence: "善的理念与灵魂上升：价值在可感世界之上。",
    blurb: "理念论：真实与善在可感世界之上，人生应朝向理念／善本身。" },
  { name: "亚里士多德", x: -0.42, y: 0.35, group: "古典", dir: "se",
    source: "外在给定（偏）", focus: "超越自我（偏）", uncertainty: "中",
    evidence: "eudaimonia 依人的功能与德性活动；非纯主观发明。",
    blurb: "中间但偏超越：通过德性、理性、实践实现「人的完善」。" },
  { name: "斯多亚派", x: -0.55, y: 0.75, group: "古典", dir: "n",
    source: "外在给定（逻各斯）", focus: "超越自我", uncertainty: "低",
    evidence: "依自然／宇宙理性而活；德性即顺应外在理性秩序。",
    blurb: "依自然／理性而活，德性即幸福；偏外在秩序＋自我超越。" },

const viewport = document.getElementById("viewport");
const canvas = document.getElementById("canvas");
const plot = document.getElementById("plot");
const legend = document.getElementById("legend");
const filters = document.getElementById("filters");
const sideEmpty = document.getElementById("sideEmpty");
const sideBody = document.getElementById("sideBody");

let activeGroup = "全部";
let selected = null;
let scale = 0.72;
let tx = 0, ty = 0;
let dragging = false;
let moved = false;
let lastX = 0, lastY = 0;

const CANVAS = 1100;

function colorOf(group) {
  return GROUPS.find(g => g.id === group).color;
}

function applyTransform() {
  // center canvas, then pan/zoom around viewport center
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const cx = vw / 2 + tx;
  const cy = vh / 2 + ty;
  canvas.style.transform = `translate(${cx}px, ${cy}px) scale(${scale}) translate(${-CANVAS/2}px, ${-CANVAS/2}px)`;
}

function fitDefault() {
  const pad = 20;
  const vw = Math.max(viewport.clientWidth, 320);
  const vh = Math.max(viewport.clientHeight, 320);
  // Fill viewport with whole canvas centered — no leftover bias
  scale = Math.min(vw / CANVAS, vh / CANVAS) * 0.96;
  tx = 0; ty = 0;
  applyTransform();
}

function toPct(p) {
  return {
    left: ((p.x + 1) / 2) * 100,
    top: ((1 - p.y) / 2) * 100,
  };
}

function quadrantOf(p) {
  if (p.x < 0 && p.y >= 0) return "客观意义倾向 ＋ 超越";
  if (p.x >= 0 && p.y >= 0) return "无预设意义 ＋ 自我超越";
  if (p.x < 0 && p.y < 0) return "客观意义倾向 ＋ 体验";
  return "无预设意义 ＋ 体验";
}

function showDetail(p) {
  selected = p.name;
  document.querySelectorAll(".point").forEach(el => {
    el.classList.toggle("selected", el.dataset.name === p.name);
  });
  sideEmpty.hidden = true;
  sideBody.hidden = false;
  const u = p.uncertainty || "中";
  let rangeHtml = "";
  if (p.xRange || p.yRange) {
    const xr = p.xRange ? `x∈[${p.xRange[0].toFixed(2)}, ${p.xRange[1].toFixed(2)}]` : "";
    const yr = p.yRange ? `y∈[${p.yRange[0].toFixed(2)}, ${p.yRange[1].toFixed(2)}]` : "";
    rangeHtml = `<p class="range-note">不确定区间：${[xr, yr].filter(Boolean).join("　")}（灰虚线框）</p>`;
  }
  sideBody.innerHTML = `
    <div class="badge"><i class="dot-swatch" style="background:${colorOf(p.group)}"></i>${p.group}<span class="uncert uncert-${u}">不确定度 ${u}</span></div>
    <h2>${p.name}</h2>
    <div class="coords">象限：${quadrantOf(p)}　·　中心 (${p.x.toFixed(2)}, ${p.y.toFixed(2)})</div>
    ${rangeHtml}
    <div class="evidence"><strong>证据　</strong>${p.evidence || "待补"}</div>
    <p class="blurb">${p.blurb}</p>
    <div class="meta-grid">
      <div class="meta-card"><div class="k">意义来源</div><div class="v">${p.source}</div></div>
      <div class="meta-card"><div class="k">人生重心</div><div class="v">${p.focus}</div></div>
    </div>
  `;
  if (typeof renderList === "function") renderList();
}

function clearDetail() {
  selected = null;
  document.querySelectorAll(".point.selected").forEach(el => el.classList.remove("selected"));
  sideBody.hidden = true;
  sideBody.innerHTML = "";
  sideEmpty.hidden = false;
  if (typeof renderList === "function") renderList();
}

function rangeBox(p) {
  const x0 = p.xRange ? p.xRange[0] : p.x;
  const x1 = p.xRange ? p.xRange[1] : p.x;
  const y0 = p.yRange ? p.yRange[0] : p.y;
  const y1 = p.yRange ? p.yRange[1] : p.y;
  // pad tiny ranges so a 1D interval is still visible
  let xa = x0, xb = x1, ya = y0, yb = y1;
  if (!p.xRange) { xa = p.x - 0.04; xb = p.x + 0.04; }
  if (!p.yRange) { ya = p.y - 0.04; yb = p.y + 0.04; }
  const left = ((xa + 1) / 2) * 100;
  const right = ((xb + 1) / 2) * 100;
  const top = ((1 - yb) / 2) * 100;
  const bottom = ((1 - ya) / 2) * 100;
  const el = document.createElement("div");
  el.className = "range-band";
  el.style.left = left + "%";
  el.style.width = (right - left) + "%";
  el.style.top = top + "%";
  el.style.height = (bottom - top) + "%";
  el.title = p.name + " 不确定区间";
  return el;
}

function render() {
  plot.querySelectorAll(".point, .range-band").forEach(n => n.remove());
  const list = POINTS.filter(p => activeGroup === "全部" || p.group === activeGroup);
  list.forEach(p => {
    if (p.xRange || p.yRange) plot.appendChild(rangeBox(p));
  });
  list.forEach(p => {
    const pos = toPct(p);
    const el = document.createElement("div");
    el.className = `point dir-${p.dir}`;
    el.dataset.name = p.name;
    el.style.left = pos.left + "%";
    el.style.top = pos.top + "%";
    el.tabIndex = 0;
    el.innerHTML = `<div class="mark" style="background:${colorOf(p.group)}"></div><div class="label">${p.name}</div>`;
    if (selected === p.name) el.classList.add("selected");
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (moved) return;
      showDetail(p);
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showDetail(p); }
    });
    plot.appendChild(el);
  });
  if (typeof renderList === "function") renderList();
}


const workspace = document.getElementById("workspace");
const listBody = document.getElementById("listBody");
const btnMap = document.getElementById("btnMap");
const btnList = document.getElementById("btnList");

function setView(mode) {
  workspace.classList.toggle("mode-map", mode === "map");
  workspace.classList.toggle("mode-list", mode === "list");
  btnMap.classList.toggle("active", mode === "map");
  btnList.classList.toggle("active", mode === "list");
  const showMapBtns = mode === "map";
  document.getElementById("btnReset").style.display = showMapBtns ? "" : "none";
  document.getElementById("btnZoomIn").style.display = showMapBtns ? "" : "none";
  document.getElementById("btnZoomOut").style.display = showMapBtns ? "" : "none";
  if (mode === "map") requestAnimationFrame(fitDefault);
}

btnMap.addEventListener("click", () => setView("map"));
btnList.addEventListener("click", () => setView("list"));

const _origRender = typeof render === "function" ? render : null;

function renderList() {
  const list = POINTS.filter(p => activeGroup === "全部" || p.group === activeGroup)
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name, "zh"));
  listBody.innerHTML = "";
  list.forEach(p => {
    const tr = document.createElement("tr");
    if (selected === p.name) tr.classList.add("active");
    tr.innerHTML = `
      <td class="list-name-cell" data-label=""><span class="list-name">${p.name}</span></td>
      <td data-label="组别">${p.group}</td>
      <td class="list-coords" data-label="坐标">(${p.x.toFixed(2)}, ${p.y.toFixed(2)})</td>
      <td data-label="不确定度"><span class="uncert uncert-${p.uncertainty || "中"}">${p.uncertainty || "中"}</span></td>
      <td class="list-evidence" data-label="证据">${p.evidence || ""}</td>
    `;
    tr.addEventListener("click", () => {
      showDetail(p);
      document.querySelectorAll(".point").forEach(el => {
        el.classList.toggle("selected", el.dataset.name === p.name);
      });
      renderList();
    });
    listBody.appendChild(tr);
  });
}


GROUPS.forEach(g => {
  const s = document.createElement("span");
  s.innerHTML = `<i class="dot-swatch" style="background:${g.color}"></i>${g.id}`;
  legend.appendChild(s);
});

["全部", ...GROUPS.map(g => g.id)].forEach(id => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = id;
  if (id === "全部") b.classList.add("active");
  b.addEventListener("click", () => {
    activeGroup = id;
    [...filters.children].forEach(el => el.classList.toggle("active", el.textContent === id));
    clearDetail();
    render();
  });
  filters.appendChild(b);
});

viewport.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".point")) return;
  dragging = true;
  moved = false;
  lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add("dragging");
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  lastX = e.clientX; lastY = e.clientY;
  tx += dx; ty += dy;
  applyTransform();
});
viewport.addEventListener("pointerup", () => {
  dragging = false;
  viewport.classList.remove("dragging");
});
viewport.addEventListener("pointercancel", () => {
  dragging = false;
  viewport.classList.remove("dragging");
});
viewport.addEventListener("click", () => {
  if (!moved) clearDetail();
});

viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const old = scale;
  const next = Math.min(2.4, Math.max(0.35, scale * Math.exp(-e.deltaY * 0.0015)));
  const ox = mx - (vw / 2 + tx);
  const oy = my - (vh / 2 + ty);
  scale = next;
  tx = mx - vw / 2 - ox * (scale / old);
  ty = my - vh / 2 - oy * (scale / old);
  applyTransform();
}, { passive: false });


// Pinch zoom (mobile)
let pinchDist = 0;
viewport.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    const [a,b] = e.touches;
    pinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: true });
viewport.addEventListener("touchmove", (e) => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const [a,b] = e.touches;
  const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (!pinchDist) { pinchDist = dist; return; }
  const rect = viewport.getBoundingClientRect();
  const mx = (a.clientX + b.clientX) / 2 - rect.left;
  const my = (a.clientY + b.clientY) / 2 - rect.top;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const old = scale;
  const next = Math.min(2.4, Math.max(0.35, scale * (dist / pinchDist)));
  pinchDist = dist;
  const ox = mx - (vw / 2 + tx);
  const oy = my - (vh / 2 + ty);
  scale = next;
  tx = mx - vw / 2 - ox * (scale / old);
  ty = my - vh / 2 - oy * (scale / old);
  applyTransform();
}, { passive: false });
viewport.addEventListener("touchend", (e) => {
  if (e.touches.length < 2) pinchDist = 0;
});

document.getElementById("btnReset").addEventListener("click", fitDefault);
document.getElementById("btnZoomIn").addEventListener("click", () => {
  scale = Math.min(2.4, scale * 1.15); applyTransform();
});
document.getElementById("btnZoomOut").addEventListener("click", () => {
  scale = Math.max(0.35, scale / 1.15); applyTransform();
});

window.addEventListener("resize", () => fitDefault());

// Fit after layout settles (side panel width known)
requestAnimationFrame(() => {
  fitDefault();
  render();
  requestAnimationFrame(fitDefault);
});
</script>
